        secondary: 'Finestrini: {% set s = states(''sensor.tesla_tele_finestrini_aperti'') %}{{ s if s not in [''unknown'', ''unavailable''] else ''-'' }}'
        icon: mdi:car-door
        color: '{{ ''amber'' if states(''sensor.tesla_tele_porte_aperte'') not in [''Tutte chiuse'', ''unknown'', ''unavailable''] else ''teal'' }}'
        multiline_secondary: true
        tap_action:
          action: more-info
        hold_action:
          action: more-info
        card_mod:
          style: "ha-card {\n  background: rgba(30,30,40,0.6);\n  border: 1px solid rgba(100,100,100,0.3);\n  border-radius: 16px;\n  backdrop-filter: blur(10px);\n}\n"
      - type: custom:mushroom-template-card
        entity: sensor.tesla_tele_sentinella_parcheggio
        primary: '{% set s = states(''sensor.tesla_tele_sentinella_parcheggio'') %}{% set n = s | int(0) %}{% set l = state_attr(''sensor.tesla_tele_sentinella_parcheggio'', ''allerte'') | int(0) %}Dal parcheggio: {{ (n ~ ('' allarme'' if n == 1 else '' allarmi'')) if is_number(s) else ''-'' }}, {{ l }} {{ ''allerta'' if l == 1 else ''allerte'' }}'
        secondary: '{% set t = state_attr(''sensor.tesla_tele_sentinella_parcheggio'', ''parcheggiata_dalle'') %}{{ (''Parcheggiata alle '' ~ (as_timestamp(t) | timestamp_custom(''%H:%M del %d/%m'')) ~ '', '' ~ (state_attr(''sensor.tesla_tele_sentinella_parcheggio'', ''dove'') or '''')) if t else ''Il conteggio riparte a ogni parcheggio (marcia in P)'' }}'
        icon: mdi:shield-car
        color: '{{ ''orange'' if states(''sensor.tesla_tele_sentinella_parcheggio'') | int(0) > 0 else ''blue'' }}'
        multiline_secondary: true
        tap_action:
          action: more-info
        hold_action:
          action: more-info
        card_mod:
          style: "ha-card {\n  background: rgba(30,30,40,0.6);\n  border: 1px solid rgba(100,100,100,0.3);\n  border-radius: 16px;\n  backdrop-filter: blur(10px);\n}\n"
