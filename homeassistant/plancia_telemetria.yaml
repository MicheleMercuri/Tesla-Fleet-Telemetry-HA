title: Telemetria Tesla
views:
- title: Telemetria Tesla
  path: telemetria-tesla
  icon: mdi:car-connected
  type: sections
  max_columns: 3
  dense_section_placement: true
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: vertical-stack
      grid_options:
        columns: full
      cards:
      - type: custom:mushroom-title-card
        title: TELEMETRIA TESLA
        subtitle: ''
        card_mod:
          style: "ha-card {\n  background: linear-gradient(135deg,\n    rgba(15, 15, 28, 0.97) 0%,\n    rgba(22, 30, 48, 0.95) 50%,\n    rgba(15, 22, 40, 0.97) 100%);\n  border: 1px solid rgba(33, 150, 243, 0.2);\n  border-radius: 24px;\n  padding: 18px 24px 14px 24px;\n  position: relative;\n  overflow: hidden;\n}\nha-card .header,\nha-card .container {\n  padding: 0 !important;\n  margin: 0 !important;\n}\nha-card .title {\n  margin: 0 !important;\n  padding: 0 !important;\n  font-size: 28px !important;\n  font-weight: 700 !important;\n  line-height: 1.1 !important;\n  display: inline-flex !important;\n  align-items: center !important;\n  gap: 10px !important;\n  width: max-content;\n  background: linear-gradient(90deg, #2196f3, #42a5f5, #2196f3);\n  background-size: 200% auto;\n  background-position: 0% center;\n  -webkit-background-clip: text;\n  -webkit-text-fill-color: transparent;\n  animation: shine 3s linear infinite;\n  pointer-events: none;\n}\nha-card .title::before {\n  content: \"\U0001F4E1\";\n  font-size: 26px;\n  line-height: 1;\n  -webkit-text-fill-color: #2196f3;\n  background: none !important;\n  filter: drop-shadow(0 0 5px rgba(33,150,243,0.55));\n}\nha-card .subtitle { display: none !important; }\nha-card::after {\n  content: \"\";\n  display: block;\n  width: 100%;\n  height: 4px;\n  margin-top: 12px;\n  border-radius: 999px;\n  background-image:\n    linear-gradient(90deg, rgba(33,150,243,0.20), rgba(66,165,245,0.20)),\n    linear-gradient(90deg,\n      transparent 0%,\n      rgba(33,150,243,0.00) 18%,\n      rgba(33,150,243,0.70) 40%,\n      rgba(66,165,245,0.85) 47%,\n      rgba(255,255,255,1.00) 50%,\n      rgba(66,165,245,0.85) 53%,\n      rgba(33,150,243,0.70) 60%,\n      rgba(33,150,243,0.00) 82%,\n      transparent 100%),\n    radial-gradient(circle,\n      rgba(255,255,255,1.00) 0%,\n      rgba(255,255,255,0.55) 35%,\n      rgba(33,150,243,0.22) 58%,\n      transparent 75%);\n  background-size: 100% 100%, 200% 100%, 18px 18px;\n  background-repeat: no-repeat;\n  background-position: 0% 0, 110% 0, -12px 50%;\n  animation: sweep-main 2.2s ease-in-out infinite alternate;\n  will-change: background-position, opacity;\n  box-shadow:\n    0 0 8px rgba(33,150,243,0.35),\n    0 0 16px rgba(66,165,245,0.22);\n  filter:\n    drop-shadow(0 0 6px rgba(255,255,255,0.18))\n    drop-shadow(0 0 10px rgba(33,150,243,0.14));\n  pointer-events: none;\n}\n@keyframes shine { to { background-position: 200% center; } }\n@keyframes sweep-main {\n  0%   { background-position: 0% 0, 110% 0, -12px 50%; opacity: 0.65; }\n  50%  { opacity: 1; }\n  100% { background-position: 0% 0, -10% 0, calc(100% + 12px) 50%; opacity: 0.65; }\n}\n"
      - type: horizontal-stack
        cards:
        - type: custom:mushroom-template-card
          entity: sensor.tesla_tele_sentinella
          primary: '{% set s = states(''sensor.tesla_tele_sentinella'') %}{{ s if s not in [''unknown'', ''unavailable''] else ''-'' }}'
          secondary: Sentinella
          icon: '{% set s = states(''sensor.tesla_tele_sentinella'') %}{{ ''mdi:shield-alert'' if s == ''Allarme'' else ''mdi:shield-search'' if s == ''Allerta'' else ''mdi:shield-car'' }}'
          color: '{% set s = states(''sensor.tesla_tele_sentinella'') %}{{ ''pink'' if s == ''Allarme'' else ''amber'' if s == ''Allerta'' else ''blue'' if s in [''Inserita'', ''A riposo'', ''Silenziosa''] else ''grey'' }}'
          multiline_secondary: true
          tap_action:
            action: more-info
          hold_action:
            action: more-info
          vertical: true
          card_mod:
            style: "ha-card {\n  --pulse-color: 33,150,243;\n  border: 1px solid rgba(33,150,243,0.35);\n  background: linear-gradient(145deg,\n    rgba(var(--pulse-color), 0.10) 0%,\n    rgba(var(--pulse-color), 0.02) 100%);\n  border-radius: 20px;\n  backdrop-filter: blur(12px);\n  --icon-size: 48px;\n  position: relative;\n  overflow: hidden;\n}\nmushroom-shape-icon {\n  filter: drop-shadow(0 0 8px rgba(33,150,243,0.6)) drop-shadow(0 0 20px rgba(33,150,243,0.3));\n}\n.primary {\n  font-size: 17px !important;\n  font-weight: 800 !important;\n  letter-spacing: 0.5px;\n  text-transform: uppercase;\n}\n.secondary {\n  font-size: 11px !important;\n  font-weight: 500 !important;\n  opacity: 0.85;\n}\nha-card::after {\n  content: \"\";\n  position: absolute;\n  bottom: 0; left: 0; right: 0;\n  height: 3px;\n  border-radius: 0 0 20px 20px;\n  background: linear-gradient(90deg,\n    transparent 0%, rgba(var(--pulse-color), 0.0) 15%,\n    rgba(var(--pulse-color), 0.8) 40%, rgba(var(--pulse-color), 1.0) 50%,\n    rgba(var(--pulse-color), 0.8) 60%, rgba(var(--pulse-color), 0.0) 85%,\n    transparent 100%);\n  background-size: 200% 100%;\n  animation: sweep-bar 2.5s ease-in-out infinite alternate;\n}\n@keyframes pulse-card {\n  0%, 100% { box-shadow: 0 0 10px rgba(var(--pulse-color), 0.15), 0 0 30px rgba(var(--pulse-color), 0.08); }\n  50% { box-shadow: 0 0 18px rgba(var(--pulse-color), 0.35), 0 0 45px rgba(var(--pulse-color), 0.15); }\n}\n@keyframes sweep-bar {\n  0%   { background-position: 120% 0; }\n  100% { background-position: -20% 0; }\n}\n"
        - type: custom:mushroom-template-card
          entity: sensor.tesla_tele_batteria
          primary: '{% set s = states(''sensor.tesla_tele_batteria'') %}{{ (s | float | round(0)) | string | replace(''.'', '','') if is_number(s) else ''-'' }}%'
          secondary: '{% set s = states(''sensor.tesla_tele_stato_carica'') %}{{ s if s not in [''unknown'', ''unavailable''] else ''-'' }}'
          icon: mdi:battery-charging-60
          color: cyan
