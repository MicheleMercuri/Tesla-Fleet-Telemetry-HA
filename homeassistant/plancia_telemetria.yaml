        - type: custom:mushroom-template-card
          entity: binary_sensor.tesla_tele_serratura
          primary: '{% set s = states(''binary_sensor.tesla_tele_serratura'') %}{{ ''Chiusa'' if s == ''off'' else ''Aperta'' if s == ''on'' else ''-'' }}'
          secondary: '{% set s = states(''sensor.tesla_tele_porte_aperte'') %}{{ s if s not in [''unknown'', ''unavailable''] else ''-'' }}'
          icon: mdi:car-door-lock
          color: '{{ ''amber'' if is_state(''binary_sensor.tesla_tele_serratura'', ''on'') or states(''sensor.tesla_tele_porte_aperte'') not in [''Tutte chiuse'', ''unknown'', ''unavailable''] else ''teal'' }}'
          multiline_secondary: true
          tap_action:
            action: more-info
          hold_action:
            action: more-info
          vertical: true
          card_mod:
            style: "ha-card {\n  --pulse-color: 38,166,154;\n  border: 1px solid rgba(38,166,154,0.35);\n  background: linear-gradient(145deg,\n    rgba(var(--pulse-color), 0.10) 0%,\n    rgba(var(--pulse-color), 0.02) 100%);\n  border-radius: 20px;\n  backdrop-filter: blur(12px);\n  --icon-size: 48px;\n  position: relative;\n  overflow: hidden;\n}\nmushroom-shape-icon {\n  filter: drop-shadow(0 0 8px rgba(38,166,154,0.6)) drop-shadow(0 0 20px rgba(38,166,154,0.3));\n}\n.primary {\n  font-size: 17px !important;\n  font-weight: 800 !important;\n  letter-spacing: 0.5px;\n  text-transform: uppercase;\n}\n.secondary {\n  font-size: 11px !important;\n  font-weight: 500 !important;\n  opacity: 0.85;\n}\nha-card::after {\n  content: \"\";\n  position: absolute;\n  bottom: 0; left: 0; right: 0;\n  height: 3px;\n  border-radius: 0 0 20px 20px;\n  background: linear-gradient(90deg,\n    transparent 0%, rgba(var(--pulse-color), 0.0) 15%,\n    rgba(var(--pulse-color), 0.8) 40%, rgba(var(--pulse-color), 1.0) 50%,\n    rgba(var(--pulse-color), 0.8) 60%, rgba(var(--pulse-color), 0.0) 85%,\n    transparent 100%);\n  background-size: 200% 100%;\n  animation: sweep-bar 2.5s ease-in-out infinite alternate;\n}\n@keyframes pulse-card {\n  0%, 100% { box-shadow: 0 0 10px rgba(var(--pulse-color), 0.15), 0 0 30px rgba(var(--pulse-color), 0.08); }\n  50% { box-shadow: 0 0 18px rgba(var(--pulse-color), 0.35), 0 0 45px rgba(var(--pulse-color), 0.15); }\n}\n@keyframes sweep-bar {\n  0%   { background-position: 120% 0; }\n  100% { background-position: -20% 0; }\n}\n"
        - type: custom:mushroom-template-card
          entity: binary_sensor.tesla_tele_collegata
          primary: '{% set s = states(''binary_sensor.tesla_tele_collegata'') %}{{ ''Collegata'' if s == ''on'' else ''In attesa'' if s == ''off'' else ''Mai vista'' }}'
          secondary: Ultimo collegamento {% set t = as_timestamp(states('sensor.tesla_tele_ultimo_collegamento'), 0) %}{{ t | timestamp_custom('%d/%m %H:%M') if t > 0 else '-' }}
          icon: mdi:access-point-network
          color: '{{ ''purple'' if is_state(''binary_sensor.tesla_tele_collegata'', ''on'') else ''grey'' }}'
          multiline_secondary: true
          tap_action:
            action: more-info
          hold_action:
            action: more-info
          vertical: true
          card_mod:
            style: "ha-card {\n  --pulse-color: 206,147,216;\n  border: 1px solid rgba(206,147,216,0.35);\n  background: linear-gradient(145deg,\n    rgba(var(--pulse-color), 0.10) 0%,\n    rgba(var(--pulse-color), 0.02) 100%);\n  border-radius: 20px;\n  backdrop-filter: blur(12px);\n  --icon-size: 48px;\n  position: relative;\n  overflow: hidden;\n}\nmushroom-shape-icon {\n  filter: drop-shadow(0 0 8px rgba(206,147,216,0.6)) drop-shadow(0 0 20px rgba(206,147,216,0.3));\n}\n.primary {\n  font-size: 17px !important;\n  font-weight: 800 !important;\n  letter-spacing: 0.5px;\n  text-transform: uppercase;\n}\n.secondary {\n  font-size: 11px !important;\n  font-weight: 500 !important;\n  opacity: 0.85;\n}\nha-card::after {\n  content: \"\";\n  position: absolute;\n  bottom: 0; left: 0; right: 0;\n  height: 3px;\n  border-radius: 0 0 20px 20px;\n  background: linear-gradient(90deg,\n    transparent 0%, rgba(var(--pulse-color), 0.0) 15%,\n    rgba(var(--pulse-color), 0.8) 40%, rgba(var(--pulse-color), 1.0) 50%,\n    rgba(var(--pulse-color), 0.8) 60%, rgba(var(--pulse-color), 0.0) 85%,\n    transparent 100%);\n  background-size: 200% 100%;\n  animation: sweep-bar 2.5s ease-in-out infinite alternate;\n}\n@keyframes pulse-card {\n  0%, 100% { box-shadow: 0 0 10px rgba(var(--pulse-color), 0.15), 0 0 30px rgba(var(--pulse-color), 0.08); }\n  50% { box-shadow: 0 0 18px rgba(var(--pulse-color), 0.35), 0 0 45px rgba(var(--pulse-color), 0.15); }\n}\n@keyframes sweep-bar {\n  0%   { background-position: 120% 0; }\n  100% { background-position: -20% 0; }\n}\n"
  - type: grid
    column_span: 1
    cards:
    - type: vertical-stack
      grid_options:
        columns: full
      cards:
      - type: custom:mushroom-title-card
        title: SENTINELLA E SICUREZZA
        subtitle: ''
        card_mod:
          style: "ha-card { padding: 12px 16px 8px 16px; }\n\nha-card .title {\n  margin: 0 !important;\n  font-size: 20px !important;\n  font-weight: 700 !important;\n  line-height: 1.1;\n  display: inline-flex;\n  align-items: center;\n  gap: 10px;\n  background: linear-gradient(90deg, #2196f3, #42a5f5, #2196f3);\n  background-size: 200% auto;\n  -webkit-background-clip: text;\n  -webkit-text-fill-color: transparent;\n  animation: shine 3s linear infinite;\n}\n\nha-card .title::before {\n  content: \"\U0001F6E1️\";\n  font-size: 20px;\n  line-height: 1;\n  -webkit-text-fill-color: #2196f3;\n  background: none !important;\n  filter: drop-shadow(0 0 8px rgba(33,150,243,0.75));\n}\n\nha-card .subtitle { display: none !important; }\n\nha-card::after {\n  content: \"\";\n  display: block;\n  width: 100%;\n  height: 4px;\n  margin-top: 10px;\n  border-radius: 999px;\n  background-image:\n    linear-gradient(90deg, rgba(33,150,243,0.30), rgba(66,165,245,0.30)),\n    linear-gradient(90deg,\n      transparent 0%,\n      rgba(33,150,243,0.00) 10%,\n      rgba(33,150,243,0.85) 28%,\n      rgba(66,165,245,0.95) 45%,\n      rgba(255,255,255,1.00) 50%,\n      rgba(66,165,245,0.95) 55%,\n      rgba(33,150,243,0.85) 72%,\n      rgba(33,150,243,0.00) 90%,\n      transparent 100%),\n    radial-gradient(circle,\n      rgba(255,255,255,1.00) 0%,\n      rgba(255,255,255,0.80) 30%,\n      rgba(33,150,243,0.50) 55%,\n      transparent 72%);\n  background-size: 100% 100%, 240% 100%, 24px 24px;\n  background-repeat: no-repeat;\n  background-position: 0% 0, 120% 0, -14px 50%;\n  animation: sweep-sec 2.7s ease-in-out infinite alternate;\n  will-change: background-position, opacity;\n  box-shadow:\n    0 0 14px rgba(33,150,243,0.70),\n    0 0 28px rgba(66,165,245,0.45),\n    0 0 4px rgba(255,255,255,0.30);\n  filter:\n    drop-shadow(0 0 8px rgba(255,255,255,0.25))\n    drop-shadow(0 0 14px rgba(33,150,243,0.30));\n  pointer-events: none;\n}\n\n@keyframes shine { to { background-position: 200% center; } }\n\n@keyframes sweep-sec {\n  0%   { background-position: 0% 0, 120% 0, -14px 50%; opacity: 0.70; }\n  50%  { opacity: 1; }\n  100% { background-position: 0% 0, -20% 0, calc(100% + 14px) 50%; opacity: 0.70; }\n}\n"
      - type: custom:mushroom-template-card
        entity: sensor.tesla_tele_sentinella
        primary: 'Sentinella: {% set s = states(''sensor.tesla_tele_sentinella'') %}{{ s if s not in [''unknown'', ''unavailable''] else ''-'' }}'
        secondary: Ultimo allarme {% set t = as_timestamp(states('sensor.tesla_tele_ultimo_allarme'), 0) %}{{ t | timestamp_custom('%d/%m %H:%M') if t > 0 else 'mai' }} · ultima allerta {% set t = as_timestamp(states('sensor.tesla_tele_ultima_allerta'), 0) %}{{ t | timestamp_custom('%d/%m %H:%M') if t > 0 else 'mai' }}
        icon: '{% set s = states(''sensor.tesla_tele_sentinella'') %}{{ ''mdi:shield-alert'' if s == ''Allarme'' else ''mdi:shield-search'' if s == ''Allerta'' else ''mdi:shield-car'' }}'
        color: '{% set s = states(''sensor.tesla_tele_sentinella'') %}{{ ''pink'' if s == ''Allarme'' else ''amber'' if s == ''Allerta'' else ''blue'' if s in [''Inserita'', ''A riposo'', ''Silenziosa''] else ''grey'' }}'
        multiline_secondary: true
        tap_action:
          action: more-info
        hold_action:
          action: more-info
        card_mod:
          style: "ha-card {\n  background: rgba(30,30,40,0.6);\n  border: 1px solid rgba(100,100,100,0.3);\n  border-radius: 16px;\n  backdrop-filter: blur(10px);\n}\n"
      - type: custom:mushroom-template-card
