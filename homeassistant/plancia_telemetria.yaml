        secondary: Chiavi abbinate {% set s = states('sensor.tesla_tele_chiavi') %}{{ s if s not in ['unknown', 'unavailable'] else '-' }} · conducente seduto {% set s = states('binary_sensor.tesla_tele_conducente') %}{{ 'sì' if s == 'on' else 'no' if s == 'off' else '-' }}
        icon: mdi:lock
        color: '{{ ''amber'' if is_state(''binary_sensor.tesla_tele_serratura'', ''on'') else ''blue'' }}'
        multiline_secondary: true
        tap_action:
          action: more-info
        hold_action:
          action: more-info
        card_mod:
          style: "ha-card {\n  background: rgba(30,30,40,0.6);\n  border: 1px solid rgba(100,100,100,0.3);\n  border-radius: 16px;\n  backdrop-filter: blur(10px);\n}\n"
      - type: custom:mushroom-template-card
