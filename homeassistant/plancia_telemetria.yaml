          style: "ha-card { padding: 12px 16px 8px 16px; }\n\nha-card .title {\n  margin: 0 !important;\n  font-size: 20px !important;\n  font-weight: 700 !important;\n  line-height: 1.1;\n  display: inline-flex;\n  align-items: center;\n  gap: 10px;\n  background: linear-gradient(90deg, #00bcd4, #26c6da, #00bcd4);\n  background-size: 200% auto;\n  -webkit-background-clip: text;\n  -webkit-text-fill-color: transparent;\n  animation: shine 3s linear infinite;\n}\n\nha-card .title::before {\n  content: \"\U0001F6E3️\";\n  font-size: 20px;\n  line-height: 1;\n  -webkit-text-fill-color: #00bcd4;\n  background: none !important;\n  filter: drop-shadow(0 0 8px rgba(0,188,212,0.75));\n}\n\nha-card .subtitle { display: none !important; }\n\nha-card::after {\n  content: \"\";\n  display: block;\n  width: 100%;\n  height: 4px;\n  margin-top: 10px;\n  border-radius: 999px;\n  background-image:\n    linear-gradient(90deg, rgba(0,188,212,0.30), rgba(38,198,218,0.30)),\n    linear-gradient(90deg,\n      transparent 0%,\n      rgba(0,188,212,0.00) 10%,\n      rgba(0,188,212,0.85) 28%,\n      rgba(38,198,218,0.95) 45%,\n      rgba(255,255,255,1.00) 50%,\n      rgba(38,198,218,0.95) 55%,\n      rgba(0,188,212,0.85) 72%,\n      rgba(0,188,212,0.00) 90%,\n      transparent 100%),\n    radial-gradient(circle,\n      rgba(255,255,255,1.00) 0%,\n      rgba(255,255,255,0.80) 30%,\n      rgba(0,188,212,0.50) 55%,\n      transparent 72%);\n  background-size: 100% 100%, 240% 100%, 24px 24px;\n  background-repeat: no-repeat;\n  background-position: 0% 0, 120% 0, -14px 50%;\n  animation: sweep-sec 2.7s ease-in-out infinite alternate;\n  will-change: background-position, opacity;\n  box-shadow:\n    0 0 14px rgba(0,188,212,0.70),\n    0 0 28px rgba(38,198,218,0.45),\n    0 0 4px rgba(255,255,255,0.30);\n  filter:\n    drop-shadow(0 0 8px rgba(255,255,255,0.25))\n    drop-shadow(0 0 14px rgba(0,188,212,0.30));\n  pointer-events: none;\n}\n\n@keyframes shine { to { background-position: 200% center; } }\n\n@keyframes sweep-sec {\n  0%   { background-position: 0% 0, 120% 0, -14px 50%; opacity: 0.70; }\n  50%  { opacity: 1; }\n  100% { background-position: 0% 0, -20% 0, calc(100% + 14px) 50%; opacity: 0.70; }\n}\n"
